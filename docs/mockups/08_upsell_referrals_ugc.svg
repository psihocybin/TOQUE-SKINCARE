<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1230" font-family="-apple-system, system-ui, sans-serif">
<title>TOQUE Ритуал — апсейл, рефералы и UGC</title>

<style>
  text { fill: #2C2C2A; }
  .label { fill: #888780; font-size: 12px; }
</style>

<text class="label" x="180" y="32" text-anchor="middle">Экран 29 — Карточка устройства (ELARA)</text>
<text class="label" x="500" y="32" text-anchor="middle">Экран 30 — Реферальная программа</text>
<text class="label" x="180" y="632" text-anchor="middle">Экран 31 — Истории клиентов (UGC)</text>
<text class="label" x="500" y="632" text-anchor="middle">Экран 32 — Запрос отзыва на МП (день 90)</text>

<!-- PHONE 1: КАРТОЧКА ELARA -->
<g>
  <rect x="50" y="50" width="260" height="540" rx="28" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="56" y="56" width="248" height="528" rx="22" fill="#FAFAF7" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <rect x="170" y="72" width="20" height="4" rx="2" fill="rgba(0,0,0,0.25)"/>

  <path d="M 78 114 l -5 5 l 5 5" stroke="#2C2C2A" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="122" text-anchor="middle" font-size="14">ELARA</text>
  <text x="282" y="118" text-anchor="end" font-size="14" fill="#888780">♡</text>

  <!-- Hero image placeholder -->
  <rect x="75" y="145" width="210" height="140" rx="10" fill="rgba(122,138,79,0.05)" stroke="rgba(122,138,79,0.15)" stroke-width="0.8"/>
  <rect x="155" y="180" width="50" height="80" rx="6" fill="rgba(122,138,79,0.2)"/>
  <circle cx="180" cy="200" r="14" fill="rgba(122,138,79,0.4)"/>
  <text x="180" y="305" text-anchor="middle" font-size="8" fill="#888780">ФОТО УСТРОЙСТВА</text>

  <text x="75" y="335" font-size="20">ELARA</text>
  <text x="75" y="355" font-size="11" fill="#888780">Микротоковый массажёр</text>

  <!-- Tabs -->
  <rect x="75" y="375" width="68" height="28" rx="14" fill="rgba(122,138,79,0.1)" stroke="#7A8A4F" stroke-width="1"/>
  <text x="109" y="393" text-anchor="middle" font-size="10">Описание</text>
  <text x="166" y="393" text-anchor="middle" font-size="10" fill="#888780">С NUO</text>
  <text x="227" y="393" text-anchor="middle" font-size="10" fill="#888780">Отзывы</text>

  <text x="75" y="426" font-size="10" fill="#2C2C2A">Тонизирует мышцы лица за 5–8 минут</text>
  <text x="75" y="441" font-size="10" fill="#2C2C2A">в день. Логично продолжает NUO:</text>
  <text x="75" y="456" font-size="10" fill="#2C2C2A">УЗ-чистка готовит, микротоки</text>
  <text x="75" y="471" font-size="10" fill="#2C2C2A">поддерживают.</text>

  <!-- Price block -->
  <rect x="75" y="490" width="210" height="48" rx="10" fill="rgba(122,138,79,0.06)"/>
  <text x="90" y="510" font-size="9" letter-spacing="1" fill="#888780">ПО ПРОМОКОДУ RITUAL30</text>
  <text x="90" y="530" font-size="16">10 900 ₽</text>
  <text x="180" y="530" font-size="11" fill="#888780" text-decoration="line-through">12 900 ₽</text>
  <text x="275" y="530" text-anchor="end" font-size="9" fill="#7A8A4F">−15%</text>

  <rect x="75" y="548" width="210" height="36" rx="18" fill="#7A8A4F"/>
  <text x="180" y="571" text-anchor="middle" font-size="12" fill="#FAFAF7">Перейти к покупке</text>
</g>

<!-- PHONE 2: РЕФЕРАЛЬНАЯ ПРОГРАММА -->
<g>
  <rect x="370" y="50" width="260" height="540" rx="28" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="376" y="56" width="248" height="528" rx="22" fill="#FAFAF7" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <rect x="490" y="72" width="20" height="4" rx="2" fill="rgba(0,0,0,0.25)"/>

  <path d="M 398 114 l -5 5 l 5 5" stroke="#2C2C2A" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="500" y="122" text-anchor="middle" font-size="14">Пригласить подругу</text>

