  <text x="112" y="831" font-size="9" fill="#888780">NUO · 3 месяца с TOQUE</text>
  <text x="90" y="858" font-size="11" font-style="italic">«Через 30 дней увидела</text>
  <text x="90" y="873" font-size="11" font-style="italic">разницу — и сама не</text>
  <text x="90" y="888" font-size="11" font-style="italic">поверила.»</text>
  <rect x="90" y="900" width="38" height="12" rx="6" fill="rgba(122,138,79,0.1)"/>
  <text x="109" y="909" text-anchor="middle" font-size="8" fill="#7A8A4F">до/после</text>

  <!-- Story 2 -->
  <rect x="75" y="930" width="210" height="100" rx="10" fill="white" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <circle cx="93" cy="950" r="12" fill="rgba(122,138,79,0.25)"/>
  <text x="93" y="954" text-anchor="middle" font-size="10" fill="#5F5E5A">Т</text>
  <text x="112" y="947" font-size="11">Татьяна, 38</text>
  <text x="112" y="961" font-size="9" fill="#888780">NUO + ELARA · 6 месяцев</text>
  <text x="90" y="988" font-size="11" font-style="italic">«Соединила два устройства</text>
  <text x="90" y="1003" font-size="11" font-style="italic">в одну систему. Контур</text>
  <text x="90" y="1018" font-size="11" font-style="italic">стал заметно чётче.»</text>

  <!-- Story 3 -->
  <rect x="75" y="1040" width="210" height="60" rx="10" fill="white" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <circle cx="93" cy="1060" r="12" fill="rgba(122,138,79,0.25)"/>
  <text x="93" y="1064" text-anchor="middle" font-size="10" fill="#5F5E5A">О</text>
  <text x="112" y="1057" font-size="11">Ольга, 52</text>
  <text x="112" y="1071" font-size="9" fill="#888780">ANIMA · 4 месяца</text>
  <text x="90" y="1090" font-size="10" font-style="italic">«LED-маска для меня...»</text>

  <!-- CTA share own -->
  <rect x="75" y="1115" width="210" height="40" rx="20" fill="rgba(122,138,79,0.08)" stroke="#7A8A4F" stroke-width="1"/>
  <text x="180" y="1140" text-anchor="middle" font-size="11" fill="#7A8A4F">Поделиться своей историей</text>
