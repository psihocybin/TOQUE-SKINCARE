  <rect x="395" y="545" width="210" height="32" rx="8" fill="white" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <circle cx="412" cy="561" r="8" fill="rgba(196,144,138,0.3)"/>
