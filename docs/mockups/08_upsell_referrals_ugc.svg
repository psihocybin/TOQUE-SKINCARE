  <text x="500" y="942" text-anchor="middle" font-size="11" fill="#5F5E5A">Это занимает 2 минуты —</text>
  <text x="500" y="957" text-anchor="middle" font-size="11" fill="#5F5E5A">и очень помогает другим женщинам.</text>

  <!-- Marketplace cards -->
  <rect x="395" y="985" width="210" height="50" rx="10" fill="white" stroke="rgba(0,0,0,0.12)" stroke-width="0.8"/>
  <rect x="410" y="1000" width="20" height="20" rx="4" fill="#CB11AB"/>
  <text x="420" y="1014" text-anchor="middle" font-size="11" fill="#FAFAF7">W</text>
  <text x="440" y="1009" font-size="12">Wildberries</text>
  <text x="440" y="1024" font-size="9" fill="#888780">оставить отзыв</text>
  <text x="595" y="1014" text-anchor="end" font-size="14" fill="#888780">›</text>

  <rect x="395" y="1045" width="210" height="50" rx="10" fill="white" stroke="rgba(0,0,0,0.12)" stroke-width="0.8"/>
  <rect x="410" y="1060" width="20" height="20" rx="4" fill="#005BFF"/>
  <text x="420" y="1074" text-anchor="middle" font-size="11" fill="#FAFAF7">O</text>
  <text x="440" y="1069" font-size="12">Ozon</text>
  <text x="440" y="1084" font-size="9" fill="#888780">оставить отзыв</text>
  <text x="595" y="1074" text-anchor="end" font-size="14" fill="#888780">›</text>

  <text x="500" y="1145" text-anchor="middle" font-size="10" fill="#888780" text-decoration="underline">Я не буду оставлять отзыв</text>
