  <!-- Heart icon -->
  <path d="M 500 800 C 500 790 510 780 520 780 C 525 780 500 800 500 800 C 500 800 475 780 480 780 C 490 780 500 790 500 800 Z M 500 800 L 478 778 Q 472 770 480 762 Q 488 754 500 768 Q 512 754 520 762 Q 528 770 522 778 Z"
        fill="rgba(196,144,138,0.4)" stroke="#C4908A" stroke-width="1.5" stroke-linejoin="round"/>

