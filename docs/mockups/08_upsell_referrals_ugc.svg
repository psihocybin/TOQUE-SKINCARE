  <circle cx="478" cy="180" r="22" fill="rgba(196,144,138,0.2)" stroke="rgba(196,144,138,0.5)" stroke-width="1"/>
  <circle cx="522" cy="180" r="22" fill="rgba(122,138,79,0.2)" stroke="rgba(122,138,79,0.5)" stroke-width="1"/>

  <text x="500" y="240" text-anchor="middle" font-size="15">Поделитесь TOQUE —</text>
  <text x="500" y="260" text-anchor="middle" font-size="15">обе получите подарок</text>

  <text x="500" y="290" text-anchor="middle" font-size="11" fill="#888780">Подруга: скидка 15% на первое устройство</text>
  <text x="500" y="306" text-anchor="middle" font-size="11" fill="#888780">Вы: 1 000 ₽ кешбэка на следующую покупку</text>

  <!-- Code block -->
  <rect x="395" y="330" width="210" height="64" rx="10" fill="rgba(122,138,79,0.06)" stroke="rgba(122,138,79,0.3)" stroke-width="0.8"/>
  <text x="410" y="350" font-size="9" letter-spacing="1" fill="#888780">ВАШ КОД</text>
  <text x="410" y="375" font-size="15" letter-spacing="2">ANNA-2025-N7</text>
  <rect x="540" y="345" width="50" height="24" rx="12" fill="#7A8A4F"/>
  <text x="565" y="361" text-anchor="middle" font-size="10" fill="#FAFAF7">Копи</text>

  <rect x="395" y="410" width="210" height="40" rx="20" fill="#7A8A4F"/>
  <text x="500" y="435" text-anchor="middle" font-size="12" fill="#FAFAF7">Поделиться ссылкой</text>

  <!-- Stats -->
