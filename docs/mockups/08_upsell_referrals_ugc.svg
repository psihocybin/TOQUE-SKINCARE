  <rect x="395" y="485" width="100" height="50" rx="10" fill="white" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <text x="445" y="507" text-anchor="middle" font-size="18">1</text>
  <text x="445" y="524" text-anchor="middle" font-size="9" fill="#888780">приглашена</text>

  <rect x="505" y="485" width="100" height="50" rx="10" fill="white" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <text x="555" y="507" text-anchor="middle" font-size="18">0</text>
  <text x="555" y="524" text-anchor="middle" font-size="9" fill="#888780">купили</text>

