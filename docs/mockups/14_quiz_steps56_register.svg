<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1230" font-family="-apple-system, system-ui, sans-serif">
<title>TOQUE — Квиз шаги 5-6 + регистрация</title>
<style>text { fill: #2C2C2A; } .lb { fill: #888780; font-size: 12px; }</style>

<text class="lb" x="180" y="32" text-anchor="middle">Шаг 5 — Опыт</text>
<text class="lb" x="500" y="32" text-anchor="middle">Шаг 6 — Возраст</text>
<text class="lb" x="180" y="632" text-anchor="middle">Регистрация (после квиза)</text>
<text class="lb" x="500" y="632" text-anchor="middle">Вход по email (magic link)</text>

<!-- ══ PHONE 1 — ШАГ 5 ОПЫТ ══ -->
<g>
  <rect x="50" y="50" width="260" height="540" rx="28" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="56" y="56" width="248" height="528" rx="22" fill="#FAFAF7" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <rect x="170" y="72" width="20" height="4" rx="2" fill="rgba(0,0,0,0.25)"/>

  <!-- Back + dashes step 5 -->
  <path d="M 78 108 l -5 5 l 5 5" stroke="#2C2C2A" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <rect x="92" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="117" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="142" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="167" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="192" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="217" y="103" width="22" height="3" rx="1.5" fill="rgba(0,0,0,0.12)"/>
  <rect x="242" y="103" width="22" height="3" rx="1.5" fill="rgba(0,0,0,0.12)"/>

  <text x="180" y="152" text-anchor="middle" font-size="22" font-weight="700">Ваш опыт</text>
  <text x="180" y="174" text-anchor="middle" font-size="22" font-weight="700">с аппаратным уходом</text>
  <text x="180" y="196" text-anchor="middle" font-size="12" fill="#888780">Подберём глубину объяснений</text>

  <!-- Experience options with icons + sublabel -->

  <!-- Новичок -->
  <rect x="68" y="214" width="224" height="58" rx="12" fill="white" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <rect x="78" y="224" width="34" height="34" rx="10" fill="rgba(0,0,0,0.04)"/>
  <text x="95" y="246" text-anchor="middle" font-size="18">🌱</text>
  <text x="122" y="236" font-size="13" font-weight="600">Новичок</text>
  <text x="122" y="252" font-size="10" fill="#888780">Первое устройство</text>
  <circle cx="278" cy="243" r="10" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

  <!-- Немного знакома — selected -->
  <rect x="68" y="280" width="224" height="58" rx="12" fill="rgba(122,138,79,0.06)" stroke="#7A8A4F" stroke-width="1.5"/>
  <rect x="78" y="290" width="34" height="34" rx="10" fill="rgba(122,138,79,0.12)"/>
  <text x="95" y="312" text-anchor="middle" font-size="18">⭐</text>
  <text x="122" y="302" font-size="13" font-weight="600">Немного знакома</text>
  <text x="122" y="318" font-size="10" fill="#888780">Делала процедуры в салоне</text>
  <circle cx="278" cy="309" r="10" fill="#7A8A4F"/>
  <text x="278" y="313" text-anchor="middle" font-size="8" fill="white">✓</text>

  <!-- Опытный -->
  <rect x="68" y="346" width="224" height="58" rx="12" fill="white" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <rect x="78" y="356" width="34" height="34" rx="10" fill="rgba(0,0,0,0.04)"/>
  <text x="95" y="378" text-anchor="middle" font-size="18">💪</text>
  <text x="122" y="368" font-size="13" font-weight="600">Опытный пользователь</text>
  <text x="122" y="384" font-size="10" fill="#888780">Уже пользуюсь дома</text>
  <circle cx="278" cy="375" r="10" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

  <!-- Эксперт -->
  <rect x="68" y="412" width="224" height="58" rx="12" fill="white" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <rect x="78" y="422" width="34" height="34" rx="10" fill="rgba(0,0,0,0.04)"/>
  <text x="95" y="444" text-anchor="middle" font-size="18">👑</text>
  <text x="122" y="434" font-size="13" font-weight="600">Эксперт</text>
  <text x="122" y="450" font-size="10" fill="#888780">Хорошо разбираюсь в косметологии</text>
  <circle cx="278" cy="441" r="10" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

  <!-- Continue -->
  <rect x="68" y="490" width="224" height="46" rx="23" fill="#7A8A4F"/>
  <text x="180" y="517" text-anchor="middle" font-size="13" fill="#FAFAF7" font-weight="600">Продолжить</text>

  <!-- Step hint -->
  <text x="180" y="548" text-anchor="middle" font-size="10" fill="#888780">Шаг 5 из 7</text>
</g>

<!-- ══ PHONE 2 — ШАГ 6 ВОЗРАСТ ══ -->
<g>
  <rect x="370" y="50" width="260" height="540" rx="28" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="376" y="56" width="248" height="528" rx="22" fill="#FAFAF7" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <rect x="490" y="72" width="20" height="4" rx="2" fill="rgba(0,0,0,0.25)"/>

  <!-- Back + dashes step 6 -->
  <path d="M 390 108 l -5 5 l 5 5" stroke="#2C2C2A" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <rect x="404" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="429" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="454" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="479" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="504" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="529" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="554" y="103" width="22" height="3" rx="1.5" fill="rgba(0,0,0,0.12)"/>

  <text x="500" y="152" text-anchor="middle" font-size="22" font-weight="700">Ваш возраст</text>
  <text x="500" y="174" text-anchor="middle" font-size="12" fill="#888780">Программа учитывает возрастные</text>
  <text x="500" y="190" text-anchor="middle" font-size="12" fill="#888780">особенности кожи</text>

  <!-- Age options as tiles -->
  <!-- 25-34 -->
  <rect x="383" y="212" width="234" height="56" rx="12" fill="white" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <!-- age icon left -->
  <rect x="393" y="222" width="36" height="36" rx="10" fill="rgba(0,0,0,0.03)"/>
  <text x="411" y="244" text-anchor="middle" font-size="20">🌸</text>
  <text x="440" y="237" font-size="15" font-weight="600">25–34</text>
  <text x="440" y="253" font-size="10" fill="#888780">Профилактика и поддержание</text>
  <circle cx="601" cy="240" r="10" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

  <!-- 35-44 — selected -->
  <rect x="383" y="276" width="234" height="56" rx="12" fill="rgba(122,138,79,0.06)" stroke="#7A8A4F" stroke-width="1.5"/>
  <rect x="393" y="286" width="36" height="36" rx="10" fill="rgba(122,138,79,0.12)"/>
  <text x="411" y="308" text-anchor="middle" font-size="20">✨</text>
  <text x="440" y="301" font-size="15" font-weight="600">35–44</text>
  <text x="440" y="317" font-size="10" fill="#888780">Тонус, контур, первые признаки</text>
  <circle cx="601" cy="304" r="10" fill="#7A8A4F"/>
  <text x="601" y="308" text-anchor="middle" font-size="8" fill="white">✓</text>

  <!-- 45-54 -->
  <rect x="383" y="340" width="234" height="56" rx="12" fill="white" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <rect x="393" y="350" width="36" height="36" rx="10" fill="rgba(0,0,0,0.03)"/>
  <text x="411" y="372" text-anchor="middle" font-size="20">🌿</text>
  <text x="440" y="365" font-size="15" font-weight="600">45–54</text>
  <text x="440" y="381" font-size="10" fill="#888780">Интенсивный уход, лифтинг</text>
  <circle cx="601" cy="368" r="10" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

  <!-- 55+ -->
  <rect x="383" y="404" width="234" height="56" rx="12" fill="white" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <rect x="393" y="414" width="36" height="36" rx="10" fill="rgba(0,0,0,0.03)"/>
  <text x="411" y="436" text-anchor="middle" font-size="20">🌺</text>
  <text x="440" y="429" font-size="15" font-weight="600">55+</text>
  <text x="440" y="445" font-size="10" fill="#888780">Деликатный глубокий уход</text>
  <circle cx="601" cy="432" r="10" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

  <!-- Continue -->
  <rect x="383" y="487" width="234" height="46" rx="23" fill="#7A8A4F"/>
  <text x="500" y="514" text-anchor="middle" font-size="13" fill="#FAFAF7" font-weight="600">Продолжить</text>

  <text x="500" y="548" text-anchor="middle" font-size="10" fill="#888780">Шаг 6 из 7</text>
</g>

<!-- ══ PHONE 3 — РЕГИСТРАЦИЯ ══ -->
<g>
  <rect x="50" y="650" width="260" height="540" rx="28" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="56" y="656" width="248" height="528" rx="22" fill="#FAFAF7" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <rect x="170" y="672" width="20" height="4" rx="2" fill="rgba(0,0,0,0.25)"/>

  <!-- Photo top area — lifestyle placeholder -->
  <rect x="56" y="656" width="248" height="200" rx="22" fill="#E8E0D4"/>
  <rect x="56" y="820" width="248" height="36" fill="#E8E0D4"/>
  <!-- woman silhouette placeholder -->
  <ellipse cx="180" cy="730" rx="32" ry="40" fill="rgba(122,138,79,0.2)"/>
  <ellipse cx="180" cy="696" rx="16" ry="18" fill="rgba(122,138,79,0.2)"/>
  <text x="180" y="784" text-anchor="middle" font-size="9" fill="#888780">Lifestyle фото клиентки</text>
  <text x="180" y="798" text-anchor="middle" font-size="8" fill="#888780">(будет добавлено)</text>

  <!-- White card overlapping photo -->
  <rect x="56" y="826" width="248" height="358" rx="22" fill="white" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <!-- Top rounded cap over photo -->
  <rect x="56" y="815" width="248" height="28" rx="14" fill="white"/>

  <text x="180" y="865" text-anchor="middle" font-size="18" font-weight="700">Создайте аккаунт</text>
  <text x="180" y="884" text-anchor="middle" font-size="11" fill="#888780">Программа сохранится и будет</text>
  <text x="180" y="899" text-anchor="middle" font-size="11" fill="#888780">доступна с любого устройства</text>

  <!-- Email button — primary -->
  <rect x="76" y="918" width="208" height="44" rx="22" fill="#7A8A4F"/>
  <!-- mail icon -->
  <rect x="88" y="930" width="20" height="14" rx="3" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.2"/>
  <path d="M 88 930 l 10 8 l 10 -8" stroke="rgba(255,255,255,0.8)" stroke-width="1.2" fill="none"/>
  <text x="195" y="944" text-anchor="middle" font-size="12" fill="#FAFAF7" font-weight="600">Продолжить с email</text>

  <!-- Apple button — secondary -->
  <rect x="76" y="970" width="208" height="44" rx="22" fill="#1A1A1A"/>
  <text x="96" y="996" font-size="14" fill="white"></text>
  <text x="195" y="996" text-anchor="middle" font-size="12" fill="white" font-weight="500">Войти с Apple</text>

  <!-- Google button -->
  <rect x="76" y="1022" width="208" height="44" rx="22" fill="white" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <!-- Google G placeholder -->
  <circle cx="96" cy="1044" r="10" fill="rgba(0,0,0,0.05)"/>
  <text x="96" y="1048" text-anchor="middle" font-size="10" fill="#4285F4" font-weight="700">G</text>
  <text x="195" y="1048" text-anchor="middle" font-size="12" fill="#2C2C2A" font-weight="500">Войти с Google</text>

  <!-- Terms -->
  <text x="180" y="1090" text-anchor="middle" font-size="9" fill="#888780">Нажимая «Продолжить», вы соглашаетесь</text>
  <text x="180" y="1104" text-anchor="middle" font-size="9" fill="#888780">с Политикой конфиденциальности</text>

  <!-- Already have account -->
  <text x="180" y="1130" text-anchor="middle" font-size="10" fill="#888780">Уже есть аккаунт? </text>
  <text x="215" y="1130" text-anchor="middle" font-size="10" fill="#7A8A4F" text-decoration="underline">Войти</text>
</g>

<!-- ══ PHONE 4 — ВХОД ПО EMAIL ══ -->
<g>
  <rect x="370" y="650" width="260" height="540" rx="28" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="376" y="656" width="248" height="528" rx="22" fill="#FAFAF7" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <rect x="490" y="672" width="20" height="4" rx="2" fill="rgba(0,0,0,0.25)"/>

  <path d="M 390 712 l -5 5 l 5 5" stroke="#2C2C2A" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <text x="500" y="720" text-anchor="middle" font-size="14" font-weight="600">Войти по email</text>

  <!-- TOQUE logo small -->
  <text x="500" y="770" text-anchor="middle" font-size="11" letter-spacing="4" fill="#7A8A4F" font-weight="600">TOQUE</text>
  <text x="500" y="786" text-anchor="middle" font-size="8" letter-spacing="2" fill="#888780">РИТУАЛ</text>

  <text x="500" y="830" text-anchor="middle" font-size="17" font-weight="700">Введите ваш email</text>
  <text x="500" y="850" text-anchor="middle" font-size="11" fill="#888780">Пришлём ссылку для входа.</text>
  <text x="500" y="866" text-anchor="middle" font-size="11" fill="#888780">Пароль не нужен.</text>

  <!-- Email input -->
  <rect x="383" y="886" width="234" height="48" rx="12" fill="white" stroke="#7A8A4F" stroke-width="1.5"/>
  <text x="397" y="905" font-size="9" fill="#888780">Email</text>
  <text x="397" y="922" font-size="12">anna@example.com</text>
  <!-- cursor -->
  <rect x="470" y="912" width="1" height="14" fill="#7A8A4F"/>

  <!-- Send button -->
  <rect x="383" y="950" width="234" height="46" rx="23" fill="#7A8A4F"/>
  <text x="500" y="977" text-anchor="middle" font-size="13" fill="#FAFAF7" font-weight="600">Получить ссылку</text>

  <!-- State: link sent -->
  <rect x="383" y="1012" width="234" height="64" rx="12" fill="rgba(122,138,79,0.06)" stroke="rgba(122,138,79,0.3)" stroke-width="0.8"/>
  <text x="500" y="1032" text-anchor="middle" font-size="11" font-weight="600" fill="#7A8A4F">✓ Ссылка отправлена</text>
  <text x="500" y="1050" text-anchor="middle" font-size="10" fill="#888780">Проверьте почту anna@example.com</text>
  <text x="500" y="1066" text-anchor="middle" font-size="10" fill="#888780">Ссылка действует 60 минут</text>

  <!-- Resend -->
  <text x="500" y="1098" text-anchor="middle" font-size="11" fill="#888780">Не пришло? </text>
  <text x="535" y="1098" text-anchor="middle" font-size="11" fill="#7A8A4F" text-decoration="underline">Отправить снова</text>

  <!-- Notice about magic link -->
  <rect x="383" y="1116" width="234" height="44" rx="10" fill="rgba(0,0,0,0.03)"/>
  <text x="500" y="1133" text-anchor="middle" font-size="10" fill="#888780">Кликните по ссылке в письме —</text>
  <text x="500" y="1148" text-anchor="middle" font-size="10" fill="#888780">вы сразу окажетесь в приложении</text>
</g>
</svg>
