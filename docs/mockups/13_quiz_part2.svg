<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1230" font-family="-apple-system, system-ui, sans-serif">
<title>TOQUE — Квиз часть 2</title>
<style>text { fill: #2C2C2A; } .lb { fill: #888780; font-size: 12px; }</style>

<text class="lb" x="180" y="32" text-anchor="middle">Шаг 2 — Имя</text>
<text class="lb" x="500" y="32" text-anchor="middle">Шаг 7 — Расписание</text>
<text class="lb" x="180" y="632" text-anchor="middle">Analyzing… (экран загрузки)</text>
<text class="lb" x="500" y="632" text-anchor="middle">Финал — Программа готова</text>

<!-- ══ PHONE 1 — ИМЯ ══ -->
<g>
  <rect x="50" y="50" width="260" height="540" rx="28" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="56" y="56" width="248" height="528" rx="22" fill="#FAFAF7" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <rect x="170" y="72" width="20" height="4" rx="2" fill="rgba(0,0,0,0.25)"/>

  <path d="M 78 108 l -5 5 l 5 5" stroke="#2C2C2A" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- dashes step 2 -->
  <rect x="92" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="117" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="142" y="103" width="22" height="3" rx="1.5" fill="rgba(0,0,0,0.12)"/>
  <rect x="167" y="103" width="22" height="3" rx="1.5" fill="rgba(0,0,0,0.12)"/>
  <rect x="192" y="103" width="22" height="3" rx="1.5" fill="rgba(0,0,0,0.12)"/>
  <rect x="217" y="103" width="22" height="3" rx="1.5" fill="rgba(0,0,0,0.12)"/>
  <rect x="242" y="103" width="22" height="3" rx="1.5" fill="rgba(0,0,0,0.12)"/>

  <text x="180" y="172" text-anchor="middle" font-size="22" font-weight="700">Как вас зовут?</text>
  <text x="180" y="194" text-anchor="middle" font-size="12" fill="#888780">Буду обращаться к вам по имени</text>

  <!-- Underline input field -->
  <text x="180" y="278" text-anchor="middle" font-size="24" fill="#888780">Ваше имя</text>
  <line x1="80" y1="296" x2="280" y2="296" stroke="#7A8A4F" stroke-width="1.5"/>
  <!-- cursor blink simulation -->
  <rect x="217" y="272" width="1.5" height="24" fill="#7A8A4F"/>

  <!-- Quick fill chip -->
  <rect x="120" y="316" width="120" height="26" rx="13" fill="rgba(122,138,79,0.1)" stroke="rgba(122,138,79,0.3)" stroke-width="0.8"/>
  <text x="180" y="333" text-anchor="middle" font-size="10" fill="#7A8A4F">Использовать: Анна</text>

  <!-- Continue (disabled — no text entered yet) -->
  <rect x="80" y="462" width="200" height="46" rx="23" fill="rgba(0,0,0,0.08)"/>
  <text x="180" y="489" text-anchor="middle" font-size="13" fill="#888780" font-weight="600">Продолжить</text>
  <text x="180" y="530" text-anchor="middle" font-size="10" fill="#888780">Кнопка станет активной после ввода</text>
</g>

<!-- ══ PHONE 2 — РАСПИСАНИЕ ══ -->
<g>
  <rect x="370" y="50" width="260" height="540" rx="28" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="376" y="56" width="248" height="528" rx="22" fill="#FAFAF7" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <rect x="490" y="72" width="20" height="4" rx="2" fill="rgba(0,0,0,0.25)"/>

  <path d="M 390 108 l -5 5 l 5 5" stroke="#2C2C2A" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- dashes step 7 = all filled -->
  <rect x="404" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="429" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="454" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="479" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="504" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="529" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>
  <rect x="554" y="103" width="22" height="3" rx="1.5" fill="#7A8A4F"/>

  <text x="500" y="148" text-anchor="middle" font-size="20" font-weight="700">Когда и как часто?</text>
  <text x="500" y="168" text-anchor="middle" font-size="12" fill="#888780">Последний шаг</text>

  <!-- Time of day -->
  <text x="390" y="198" font-size="11" font-weight="700">Когда удобно делать процедуры</text>
  <!-- 3 chips — утром selected -->
  <rect x="383" y="206" width="72" height="32" rx="16" fill="rgba(122,138,79,0.1)" stroke="#7A8A4F" stroke-width="1.2"/>
  <text x="419" y="226" text-anchor="middle" font-size="10" fill="#7A8A4F" font-weight="600">☀️ Утром</text>
  <rect x="460" y="206" width="72" height="32" rx="16" fill="white" stroke="rgba(0,0,0,0.1)" stroke-width="0.8"/>
  <text x="496" y="226" text-anchor="middle" font-size="10" fill="#888780">🌤 Днём</text>
  <rect x="537" y="206" width="80" height="32" rx="16" fill="white" stroke="rgba(0,0,0,0.1)" stroke-width="0.8"/>
  <text x="577" y="226" text-anchor="middle" font-size="10" fill="#888780">🌙 Вечером</text>

  <!-- Frequency -->
  <text x="390" y="260" font-size="11" font-weight="700">Как часто готовы</text>

  <rect x="383" y="268" width="234" height="46" rx="12" fill="rgba(122,138,79,0.06)" stroke="#7A8A4F" stroke-width="1.5"/>
  <text x="500" y="287" text-anchor="middle" font-size="12" font-weight="600">2–3 раза в неделю</text>
  <text x="500" y="302" text-anchor="middle" font-size="10" fill="#888780">Мягкий старт</text>
  <circle cx="601" cy="291" r="8" fill="#7A8A4F"/>
  <text x="601" y="295" text-anchor="middle" font-size="6" fill="white">✓</text>

  <rect x="383" y="320" width="234" height="46" rx="12" fill="white" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <text x="500" y="339" text-anchor="middle" font-size="12" font-weight="600">4–5 раз в неделю</text>
  <text x="500" y="354" text-anchor="middle" font-size="10" fill="#888780">Оптимально</text>

  <rect x="383" y="372" width="234" height="46" rx="12" fill="white" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <text x="500" y="391" text-anchor="middle" font-size="12" font-weight="600">Каждый день</text>
  <text x="500" y="406" text-anchor="middle" font-size="10" fill="#888780">Максимальная эффективность</text>

  <!-- Baseline photo checkbox -->
  <rect x="383" y="428" width="234" height="40" rx="10" fill="rgba(0,0,0,0.02)"/>
  <rect x="393" y="436" width="18" height="18" rx="4" fill="#7A8A4F"/>
  <text x="402" y="449" text-anchor="middle" font-size="10" fill="white">✓</text>
  <text x="418" y="445" font-size="10">Хочу сделать фото для сравнения</text>
  <text x="418" y="460" font-size="9" fill="#888780">Сравните результат через 30 дней</text>

  <!-- Continue — active -->
  <rect x="383" y="487" width="234" height="46" rx="23" fill="#7A8A4F"/>
  <text x="500" y="514" text-anchor="middle" font-size="13" fill="#FAFAF7" font-weight="600">Готово →</text>
</g>

<!-- ══ PHONE 3 — ANALYZING ══ -->
<g>
  <rect x="50" y="650" width="260" height="540" rx="28" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="56" y="656" width="248" height="528" rx="22" fill="#FAFAF7" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <rect x="170" y="672" width="20" height="4" rx="2" fill="rgba(0,0,0,0.25)"/>

  <text x="180" y="730" text-anchor="middle" font-size="20" font-weight="700">Составляем</text>
  <text x="180" y="752" text-anchor="middle" font-size="20" font-weight="700">программу…</text>

  <!-- 5 progress rows -->
  <!-- Row 1 — done -->
  <text x="80" y="800" font-size="11">Определяем тип ухода</text>
  <circle cx="271" cy="796" r="9" fill="#7A8A4F"/>
  <text x="271" y="800" text-anchor="middle" font-size="8" fill="white">✓</text>
  <rect x="80" y="806" width="185" height="3" rx="1.5" fill="rgba(0,0,0,0.06)"/>
  <rect x="80" y="806" width="185" height="3" rx="1.5" fill="#7A8A4F"/>

  <!-- Row 2 — done -->
  <text x="80" y="832" font-size="11">Подбираем режимы процедур</text>
  <circle cx="271" cy="828" r="9" fill="#7A8A4F"/>
  <text x="271" y="832" text-anchor="middle" font-size="8" fill="white">✓</text>
  <rect x="80" y="838" width="185" height="3" rx="1.5" fill="rgba(0,0,0,0.06)"/>
  <rect x="80" y="838" width="185" height="3" rx="1.5" fill="#7A8A4F"/>

  <!-- Row 3 — in progress -->
  <text x="80" y="864" font-size="11" font-weight="600">Составляем расписание</text>
  <text x="271" y="864" text-anchor="end" font-size="10" fill="#7A8A4F">58%</text>
  <rect x="80" y="870" width="185" height="3" rx="1.5" fill="rgba(0,0,0,0.06)"/>
  <rect x="80" y="870" width="107" height="3" rx="1.5" fill="#7A8A4F"/>

  <!-- Row 4 — pending -->
  <text x="80" y="896" font-size="11" fill="#888780">Настраиваем советы дня</text>
  <rect x="80" y="902" width="185" height="3" rx="1.5" fill="rgba(0,0,0,0.06)"/>

  <!-- Row 5 — pending -->
  <text x="80" y="928" font-size="11" fill="#888780">Финализируем программу</text>
  <rect x="80" y="934" width="185" height="3" rx="1.5" fill="rgba(0,0,0,0.06)"/>

  <!-- Trust card -->
  <rect x="68" y="964" width="224" height="80" rx="14" fill="white" stroke="rgba(0,0,0,0.07)" stroke-width="0.5"/>
  <text x="90" y="984" font-size="11" font-weight="600">Нам доверяют тысячи клиенток</text>
  <!-- stars -->
  <text x="90" y="1004" font-size="14">★★★★★</text>
  <text x="90" y="1022" font-size="10" font-style="italic" fill="#5F5E5A">«Через 3 недели подруги спросили</text>
  <text x="90" y="1035" font-size="10" font-style="italic" fill="#5F5E5A">что я делаю с кожей. TOQUE.»</text>
  <text x="90" y="1020" font-size="8" fill="#888780">  </text>
</g>

<!-- ══ PHONE 4 — DONE ══ -->
<g>
  <rect x="370" y="650" width="260" height="540" rx="28" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="376" y="656" width="248" height="528" rx="22" fill="#FAFAF7" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <rect x="490" y="672" width="20" height="4" rx="2" fill="rgba(0,0,0,0.25)"/>

  <!-- Gradient bg circle like Welcome -->
  <circle cx="500" cy="790" r="130" fill="url(#heroGrad)" opacity="0.6"/>

  <!-- Sparkles -->
  <text x="428" y="720" font-size="18" fill="#7A8A4F" opacity="0.5">✦</text>
  <text x="580" y="750" font-size="14" fill="#C4908A" opacity="0.5">✦</text>
  <text x="410" y="820" font-size="10" fill="#7A8A4F" opacity="0.4">✦</text>
  <text x="590" y="820" font-size="20" fill="#7A8A4F" opacity="0.3">✦</text>

  <!-- Check circle -->
  <circle cx="500" cy="790" r="36" fill="rgba(122,138,79,0.12)"/>
  <circle cx="500" cy="790" r="26" fill="rgba(122,138,79,0.2)"/>
  <text x="500" y="798" text-anchor="middle" font-size="22" fill="#7A8A4F">✓</text>

  <!-- Main text -->
  <text x="500" y="852" text-anchor="middle" font-size="17" font-weight="700">Анна, ваша программа</text>
  <text x="500" y="872" text-anchor="middle" font-size="17" font-weight="700">готова.</text>
  <text x="500" y="895" text-anchor="middle" font-size="11" fill="#888780">30 дней персонального ухода.</text>
  <text x="500" y="910" text-anchor="middle" font-size="11" fill="#888780">Протоколы под ваше устройство.</text>
  <text x="500" y="925" text-anchor="middle" font-size="11" fill="#888780">Первая процедура — завтра.</text>

  <!-- What's inside -->
  <text x="500" y="955" text-anchor="middle" font-size="8" letter-spacing="1.5" fill="#888780">ЧТО ВНУТРИ</text>
  <text x="393" y="972" font-size="10" fill="#5F5E5A">📅 30 дней ритуала по 5–10 минут</text>
  <text x="393" y="988" font-size="10" fill="#5F5E5A">🎥 Видео-инструкции к каждой процедуре</text>
  <text x="393" y="1004" font-size="10" fill="#5F5E5A">📷 Журнал и фото-сравнение</text>
  <text x="393" y="1020" font-size="10" fill="#5F5E5A">💬 Советы косметолога MASSK</text>

  <!-- First session card -->
  <rect x="383" y="1030" width="234" height="36" rx="10" fill="rgba(122,138,79,0.08)"/>
  <text x="395" y="1045" font-size="8" letter-spacing="1" fill="#7A8A4F">ПЕРВОЕ ЗАНЯТИЕ</text>
  <text x="395" y="1059" font-size="11">Завтра в 09:00 · Очищение · NUO</text>

  <!-- CTA -->
  <rect x="383" y="1076" width="234" height="46" rx="23" fill="#7A8A4F"/>
  <text x="500" y="1103" text-anchor="middle" font-size="12" fill="#FAFAF7" font-weight="600">Создать аккаунт и начать</text>
  <text x="500" y="1136" text-anchor="middle" font-size="11" fill="#888780">Уже есть аккаунт? Войти</text>
</g>
</svg>
