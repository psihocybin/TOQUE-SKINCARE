  <rect x="393" y="362" width="32" height="32" rx="8" fill="rgba(122,138,79,0.1)"/>
  <text x="409" y="382" text-anchor="middle" font-size="9" fill="#7A8A4F" font-weight="700">A</text>
  <text x="434" y="375" font-size="13" font-weight="600">ANIMA</text>
  <text x="434" y="390" font-size="10" fill="#888780">LED-маска · 8 спектров · NIR</text>
