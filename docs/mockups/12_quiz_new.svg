<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1230" font-family="-apple-system, system-ui, sans-serif">
<title>TOQUE — Новый квиз</title>
<style>text { fill: #2C2C2A; } .lb { fill: #888780; font-size: 12px; }</style>

<text class="lb" x="180" y="32" text-anchor="middle">Welcome (новый)</text>
<text class="lb" x="500" y="32" text-anchor="middle">Шаг 1 — Выбор устройства</text>
<text class="lb" x="180" y="632" text-anchor="middle">Шаг 3 — Главная задача</text>
<text class="lb" x="500" y="632" text-anchor="middle">Шаг 4 — Тип кожи</text>

<!-- ══ PHONE 1 — WELCOME ══ -->
<g>
  <rect x="50" y="50" width="260" height="540" rx="28" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="56" y="56" width="248" height="528" rx="22" fill="#FAFAF7" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <rect x="170" y="72" width="20" height="4" rx="2" fill="rgba(0,0,0,0.25)"/>

  <!-- Gradient circle hero -->
  <defs>
    <radialGradient id="heroGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F1EFE8"/>
      <stop offset="100%" stop-color="#FAFAF7"/>
    </radialGradient>
  </defs>
  <circle cx="180" cy="190" r="110" fill="url(#heroGrad)"/>
  <!-- Device placeholder in circle -->
  <rect x="148" y="148" width="64" height="84" rx="12" fill="rgba(122,138,79,0.15)"/>
  <text x="180" y="185" text-anchor="middle" font-size="11" fill="#7A8A4F" font-weight="700">TOQUE</text>
  <text x="180" y="200" text-anchor="middle" font-size="8" fill="#888780">NUO</text>
  <!-- glow dots -->
  <circle cx="118" cy="155" r="4" fill="rgba(122,138,79,0.3)"/>
  <circle cx="240" cy="240" r="6" fill="rgba(196,144,138,0.25)"/>
  <circle cx="130" cy="235" r="3" fill="rgba(122,138,79,0.2)"/>

  <!-- Text block -->
  <text x="180" y="328" text-anchor="middle" font-size="22" font-weight="700">Ваш персональный</text>
  <text x="180" y="352" text-anchor="middle" font-size="22" font-weight="700">ритуал ухода</text>
  <text x="180" y="378" text-anchor="middle" font-size="11" fill="#888780">Пройдите квиз — получите 30-дневную</text>
  <text x="180" y="393" text-anchor="middle" font-size="11" fill="#888780">программу под ваше устройство</text>

  <!-- CTA button -->
  <rect x="90" y="420" width="180" height="48" rx="24" fill="#7A8A4F"/>
  <text x="180" y="449" text-anchor="middle" font-size="14" fill="#FAFAF7" font-weight="600">Начать</text>

  <!-- Not now -->
  <text x="180" y="493" text-anchor="middle" font-size="12" fill="#888780">Не сейчас</text>

  <!-- Small trust text -->
  <text x="180" y="555" text-anchor="middle" font-size="9" fill="#888780">Занимает 2 минуты · Бесплатно</text>
</g>

