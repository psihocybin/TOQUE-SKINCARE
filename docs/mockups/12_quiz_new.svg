  <rect x="393" y="308" width="32" height="32" rx="8" fill="rgba(122,138,79,0.15)"/>
  <text x="409" y="328" text-anchor="middle" font-size="9" fill="#7A8A4F" font-weight="700">L</text>
  <text x="434" y="321" font-size="13" font-weight="600">LYRA</text>
  <text x="434" y="336" font-size="10" fill="#888780">DualCare™ · микротоки · LED</text>
  <circle cx="601" cy="324" r="10" fill="#7A8A4F"/>
  <text x="601" y="328" text-anchor="middle" font-size="8" fill="white">✓</text>

