  <rect x="393" y="254" width="32" height="32" rx="8" fill="rgba(122,138,79,0.1)"/>
  <text x="409" y="274" text-anchor="middle" font-size="9" fill="#7A8A4F" font-weight="700">E</text>
  <text x="434" y="267" font-size="13" font-weight="600">ELARA</text>
