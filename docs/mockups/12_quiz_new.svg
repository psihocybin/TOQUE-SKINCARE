  <!-- SYLVA — NEW badge -->
  <rect x="383" y="462" width="234" height="48" rx="12" fill="white" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <rect x="393" y="470" width="32" height="32" rx="8" fill="rgba(122,138,79,0.1)"/>
  <text x="409" y="490" text-anchor="middle" font-size="9" fill="#7A8A4F" font-weight="700">S</text>
