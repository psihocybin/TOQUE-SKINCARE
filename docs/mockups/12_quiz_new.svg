  <rect x="383" y="408" width="234" height="48" rx="12" fill="white" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <rect x="393" y="416" width="32" height="32" rx="8" fill="rgba(122,138,79,0.1)"/>
  <text x="409" y="436" text-anchor="middle" font-size="9" fill="#7A8A4F" font-weight="700">AU</text>
  <text x="434" y="429" font-size="13" font-weight="600">AURA</text>
