<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1230" font-family="-apple-system, system-ui, sans-serif">
<title>TOQUE Ритуал — альтернативные ветки и сервисы</title>

<style>
  text { fill: #2C2C2A; }
  .label { fill: #888780; font-size: 12px; }
</style>

<text class="label" x="180" y="32" text-anchor="middle">Экран 21 — Подарок-трек Welcome</text>
<text class="label" x="500" y="32" text-anchor="middle">Экран 22 — Чат поддержки</text>
<text class="label" x="180" y="632" text-anchor="middle">Экран 23 — Моя программа (30 дней)</text>
<text class="label" x="500" y="632" text-anchor="middle">Экран 24 — Выбор времени напоминаний</text>

<!-- PHONE 1: ПОДАРОК-ТРЕК WELCOME -->
<g>
  <rect x="50" y="50" width="260" height="540" rx="28" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="56" y="56" width="248" height="528" rx="22" fill="#FAFAF7" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <rect x="170" y="72" width="20" height="4" rx="2" fill="rgba(0,0,0,0.25)"/>

  <text x="180" y="140" text-anchor="middle" font-size="14" letter-spacing="5" fill="#7A8A4F">TOQUE</text>

  <rect x="158" y="210" width="44" height="34" rx="4" fill="none" stroke="rgba(196,144,138,0.7)" stroke-width="1.5"/>
  <rect x="158" y="210" width="44" height="8" fill="rgba(196,144,138,0.35)"/>
  <line x1="180" y1="210" x2="180" y2="244" stroke="rgba(196,144,138,0.6)" stroke-width="1"/>
  <path d="M 174 210 Q 174 200 178 200 Q 180 200 180 210" stroke="rgba(196,144,138,0.6)" stroke-width="1.5" fill="none"/>
  <path d="M 186 210 Q 186 200 182 200 Q 180 200 180 210" stroke="rgba(196,144,138,0.6)" stroke-width="1.5" fill="none"/>

  <text x="180" y="300" text-anchor="middle" font-size="17">Получили TOQUE</text>
  <text x="180" y="322" text-anchor="middle" font-size="17">в подарок?</text>

  <text x="180" y="370" text-anchor="middle" font-size="11" fill="#5F5E5A">Не торопимся — у вас нет</text>
  <text x="180" y="386" text-anchor="middle" font-size="11" fill="#5F5E5A">никаких обязательств.</text>

  <text x="180" y="416" text-anchor="middle" font-size="11" fill="#5F5E5A">Попробуем одну процедуру</text>
  <text x="180" y="432" text-anchor="middle" font-size="11" fill="#5F5E5A">за 3 минуты — поймёте,</text>
  <text x="180" y="448" text-anchor="middle" font-size="11" fill="#5F5E5A">нравится ли.</text>

  <rect x="75" y="495" width="210" height="44" rx="22" fill="#7A8A4F"/>
  <text x="180" y="523" text-anchor="middle" font-size="13" fill="#FAFAF7">Попробовать 3 минуты</text>

  <text x="180" y="565" text-anchor="middle" font-size="11" fill="#5F5E5A" text-decoration="underline">Готова к полной программе на 30 дней</text>
</g>

<!-- PHONE 2: ЧАТ ПОДДЕРЖКИ -->
<g>
  <rect x="370" y="50" width="260" height="540" rx="28" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="376" y="56" width="248" height="528" rx="22" fill="#FAFAF7" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <rect x="490" y="72" width="20" height="4" rx="2" fill="rgba(0,0,0,0.25)"/>

  <path d="M 398 114 l -5 5 l 5 5" stroke="#2C2C2A" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="428" cy="118" r="14" fill="rgba(122,138,79,0.2)"/>
  <text x="428" y="122" text-anchor="middle" font-size="11" fill="#7A8A4F">Ю</text>
  <text x="450" y="116" font-size="12">Юлия, эксперт</text>
  <circle cx="453" cy="127" r="2.5" fill="#7A8A4F"/>
  <text x="460" y="129" font-size="9" fill="#5F5E5A">онлайн</text>

  <line x1="395" y1="148" x2="605" y2="148" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <text x="500" y="168" text-anchor="middle" font-size="9" fill="#888780">отвечаем в течение 4 часов</text>

  <rect x="395" y="192" width="160" height="48" rx="14" fill="rgba(0,0,0,0.04)"/>
  <text x="407" y="210" font-size="10">Здравствуйте, Анна.</text>
  <text x="407" y="227" font-size="10">Я Юлия. Чем помочь?</text>
  <text x="395" y="254" font-size="8" fill="#888780">09:12</text>

  <rect x="440" y="272" width="165" height="62" rx="14" fill="rgba(122,138,79,0.15)"/>
  <text x="452" y="290" font-size="10">У меня покалывание</text>
  <text x="452" y="307" font-size="10">после процедуры —</text>
  <text x="452" y="324" font-size="10">это нормально?</text>
  <text x="605" y="350" text-anchor="end" font-size="8" fill="#888780">09:14</text>

  <rect x="395" y="365" width="190" height="100" rx="14" fill="rgba(0,0,0,0.04)"/>
  <text x="407" y="384" font-size="10">Да, лёгкое покалывание</text>
  <text x="407" y="401" font-size="10">во время УЗ — норма.</text>
  <text x="407" y="423" font-size="10">Тревожны: жжение,</text>
  <text x="407" y="440" font-size="10">сильное покраснение,</text>
  <text x="407" y="457" font-size="10">зуд.</text>
  <text x="395" y="482" font-size="8" fill="#888780">09:23</text>

  <line x1="395" y1="510" x2="605" y2="510" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <rect x="395" y="520" width="170" height="36" rx="18" fill="white" stroke="rgba(0,0,0,0.12)" stroke-width="0.5"/>
  <text x="410" y="543" font-size="11" fill="#888780">Сообщение…</text>

  <circle cx="585" cy="538" r="16" fill="#7A8A4F"/>
  <path d="M 580 538 L 590 533 L 590 543 Z" fill="#FAFAF7"/>
</g>

<!-- PHONE 3: МОЯ ПРОГРАММА 30 ДНЕЙ -->
<g>
  <rect x="50" y="650" width="260" height="540" rx="28" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="56" y="656" width="248" height="528" rx="22" fill="#FAFAF7" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <rect x="170" y="672" width="20" height="4" rx="2" fill="rgba(0,0,0,0.25)"/>

  <path d="M 78 712 l -5 5 l 5 5" stroke="#2C2C2A" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="720" text-anchor="middle" font-size="14">Моя программа</text>

  <text x="75" y="753" font-size="11" fill="#888780">День 7 из 30 · 6 процедур сделано</text>

  <!-- Day grid: 5 cols × 6 rows, r=14, gap=8 -->
  <!-- Row 1: days 1-5 (done) -->
  <circle cx="91" cy="800" r="14" fill="#7A8A4F"/><text x="91" y="804" text-anchor="middle" font-size="10" fill="#FAFAF7">1</text>
  <circle cx="131" cy="800" r="14" fill="#7A8A4F"/><text x="131" y="804" text-anchor="middle" font-size="10" fill="#FAFAF7">2</text>
  <circle cx="171" cy="800" r="14" fill="#7A8A4F"/><text x="171" y="804" text-anchor="middle" font-size="10" fill="#FAFAF7">3</text>
  <circle cx="211" cy="800" r="14" fill="#7A8A4F"/><text x="211" y="804" text-anchor="middle" font-size="10" fill="#FAFAF7">4</text>
  <circle cx="251" cy="800" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="251" y="804" text-anchor="middle" font-size="10" fill="#888780">5</text>

  <!-- Row 2: 6-10 -->
  <circle cx="91" cy="840" r="14" fill="#7A8A4F"/><text x="91" y="844" text-anchor="middle" font-size="10" fill="#FAFAF7">6</text>
  <circle cx="131" cy="840" r="14" fill="none" stroke="#7A8A4F" stroke-width="2"/><text x="131" y="844" text-anchor="middle" font-size="10" fill="#7A8A4F">7</text>
  <circle cx="171" cy="840" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="171" y="844" text-anchor="middle" font-size="10" fill="#888780">8</text>
  <circle cx="211" cy="840" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="211" y="844" text-anchor="middle" font-size="10" fill="#888780">9</text>
  <circle cx="251" cy="840" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="251" y="844" text-anchor="middle" font-size="10" fill="#888780">10</text>

  <!-- Row 3: 11-15 -->
  <circle cx="91" cy="880" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="91" y="884" text-anchor="middle" font-size="10" fill="#888780">11</text>
  <circle cx="131" cy="880" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="131" y="884" text-anchor="middle" font-size="10" fill="#888780">12</text>
  <circle cx="171" cy="880" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="171" y="884" text-anchor="middle" font-size="10" fill="#888780">13</text>
  <circle cx="211" cy="880" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="211" y="884" text-anchor="middle" font-size="10" fill="#888780">14</text>
  <circle cx="251" cy="880" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="251" y="884" text-anchor="middle" font-size="10" fill="#888780">15</text>

  <!-- Row 4: 16-20 -->
  <circle cx="91" cy="920" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="91" y="924" text-anchor="middle" font-size="10" fill="#888780">16</text>
  <circle cx="131" cy="920" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="131" y="924" text-anchor="middle" font-size="10" fill="#888780">17</text>
  <circle cx="171" cy="920" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="171" y="924" text-anchor="middle" font-size="10" fill="#888780">18</text>
  <circle cx="211" cy="920" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="211" y="924" text-anchor="middle" font-size="10" fill="#888780">19</text>
  <circle cx="251" cy="920" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="251" y="924" text-anchor="middle" font-size="10" fill="#888780">20</text>

  <!-- Row 5: 21-25 -->
  <circle cx="91" cy="960" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="91" y="964" text-anchor="middle" font-size="10" fill="#888780">21</text>
  <circle cx="131" cy="960" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="131" y="964" text-anchor="middle" font-size="10" fill="#888780">22</text>
  <circle cx="171" cy="960" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="171" y="964" text-anchor="middle" font-size="10" fill="#888780">23</text>
  <circle cx="211" cy="960" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="211" y="964" text-anchor="middle" font-size="10" fill="#888780">24</text>
  <circle cx="251" cy="960" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="251" y="964" text-anchor="middle" font-size="10" fill="#888780">25</text>

  <!-- Row 6: 26-30 -->
  <circle cx="91" cy="1000" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="91" y="1004" text-anchor="middle" font-size="10" fill="#888780">26</text>
  <circle cx="131" cy="1000" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="131" y="1004" text-anchor="middle" font-size="10" fill="#888780">27</text>
  <circle cx="171" cy="1000" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="171" y="1004" text-anchor="middle" font-size="10" fill="#888780">28</text>
  <circle cx="211" cy="1000" r="14" fill="#FAFAF7" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="211" y="1004" text-anchor="middle" font-size="10" fill="#888780">29</text>
  <circle cx="251" cy="1000" r="14" fill="rgba(196,144,138,0.15)" stroke="rgba(196,144,138,0.5)" stroke-width="1"/><text x="251" y="1004" text-anchor="middle" font-size="10" fill="#888780">30</text>

  <!-- Legend -->
  <text x="75" y="1055" font-size="9" letter-spacing="1" fill="#888780">УСЛОВНЫЕ ОБОЗНАЧЕНИЯ</text>

  <circle cx="83" cy="1080" r="6" fill="#7A8A4F"/>
  <text x="95" y="1084" font-size="10" fill="#5F5E5A">сделано</text>

  <circle cx="155" cy="1080" r="6" fill="none" stroke="#7A8A4F" stroke-width="1.5"/>
  <text x="167" y="1084" font-size="10" fill="#5F5E5A">сегодня</text>

  <circle cx="225" cy="1080" r="6" fill="#FAFAF7" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
  <text x="237" y="1084" font-size="10" fill="#5F5E5A">впереди</text>

  <circle cx="83" cy="1105" r="6" fill="rgba(196,144,138,0.15)" stroke="rgba(196,144,138,0.5)" stroke-width="1"/>
  <text x="95" y="1109" font-size="10" fill="#5F5E5A">финал — фото-сравнение</text>
</g>

<!-- PHONE 4: ВЫБОР ВРЕМЕНИ -->
<g>
  <rect x="370" y="650" width="260" height="540" rx="28" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="376" y="656" width="248" height="528" rx="22" fill="#FAFAF7" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <rect x="490" y="672" width="20" height="4" rx="2" fill="rgba(0,0,0,0.25)"/>

  <path d="M 398 712 l -5 5 l 5 5" stroke="#2C2C2A" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="500" y="720" text-anchor="middle" font-size="14">Время процедур</text>

  <text x="500" y="755" text-anchor="middle" font-size="11" fill="#888780">в это время будут напоминания</text>

  <text x="448" y="828" text-anchor="middle" font-size="14" fill="rgba(0,0,0,0.18)">08</text>
  <text x="552" y="828" text-anchor="middle" font-size="14" fill="rgba(0,0,0,0.18)">59</text>

  <rect x="395" y="850" width="210" height="52" rx="10" fill="rgba(122,138,79,0.08)"/>
  <text x="448" y="891" text-anchor="middle" font-size="32">09</text>
  <text x="500" y="891" text-anchor="middle" font-size="32">:</text>
  <text x="552" y="891" text-anchor="middle" font-size="32">00</text>

  <text x="448" y="930" text-anchor="middle" font-size="14" fill="rgba(0,0,0,0.18)">10</text>
  <text x="552" y="930" text-anchor="middle" font-size="14" fill="rgba(0,0,0,0.18)">01</text>

  <line x1="395" y1="965" x2="605" y2="965" stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>

  <text x="395" y="990" font-size="9" letter-spacing="1" fill="#888780">БЫСТРЫЙ ВЫБОР</text>

  <rect x="395" y="1005" width="65" height="32" rx="16" fill="rgba(122,138,79,0.1)" stroke="#7A8A4F" stroke-width="1"/>
  <text x="427" y="1025" text-anchor="middle" font-size="11">Утром</text>

  <rect x="470" y="1005" width="75" height="32" rx="16" fill="white" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>
  <text x="507" y="1025" text-anchor="middle" font-size="11">Вечером</text>

  <rect x="555" y="1005" width="50" height="32" rx="16" fill="white" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>
  <text x="580" y="1025" text-anchor="middle" font-size="11">Гибко</text>

  <rect x="395" y="1115" width="210" height="44" rx="22" fill="#7A8A4F"/>
  <text x="500" y="1143" text-anchor="middle" font-size="13" fill="#FAFAF7">Сохранить</text>
</g>

</svg>
